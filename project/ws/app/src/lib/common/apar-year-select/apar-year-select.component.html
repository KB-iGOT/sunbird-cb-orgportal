<div class="apar-year-wrapper" [ngClass]="layout">
  <label [attr.for]="fieldId" class="apar-year-label" [class.required]="required">{{label}}</label>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="apar-year-select" [style.width]="width">
    <mat-select [id]="fieldId" [value]="value" [required]="required" [disabled]="disabled"
      (selectionChange)="onSelectionChange($event.value)" [attr.aria-label]="label" placeholder="Select APAR Year">
      <mat-option *ngFor="let year of years" [value]="year.value"
        [disabled]="editableOnly && !year.editable">{{year.label}}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
