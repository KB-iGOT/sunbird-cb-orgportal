<ng-container>
  <!-- Loader -->
  <div class="flex items-center mx-auto fixed-spinner-create" *ngIf="isLoading">
    <mat-spinner [diameter]="40" [strokeWidth]="4"></mat-spinner>
  </div>
</ng-container>

<div class="dialog-main">
  <!-- Fixed header -->
  <h2 mat-dialog-title class="font-text header-fixed">Update organisation logo</h2>

  <div class="dialog-body">
    <!-- Cropper Section -->
    <div class="cropper-section">
      <image-cropper [imageChangedEvent]="imageChangedEvent" [aspectRatio]="1" [resizeToWidth]="300"
        [maintainAspectRatio]="true" [roundCropper]="false" [transform]="transform" format="jpeg"
        (imageCropped)="onImageCropped($event)" (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
        (loadImageFailed)="loadImageFailed($event)" class="custom-cropper">
      </image-cropper>
    </div>
    <!-- Zoom Controls: Minus Button + Slider + Plus Button -->
    <div class="zoom-controls items-center mx-auto">
      <mat-slider min="0.3" max="3" step="0.05" thumbLabel [value]="zoomValue" (input)="zoomChange($event.value)">
      </mat-slider>
      <button mat-mini-fab color="primary" (click)="zoomOut()" [disabled]="zoomValue <= 0.3" aria-label="Zoom out">
        <mat-icon>remove</mat-icon>
      </button>

      <button mat-mini-fab color="primary" (click)="zoomIn()" [disabled]="zoomValue >= 3" aria-label="Zoom in">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <!-- Instructions fixed after cropper -->
    <div class="instructions-text">
      <p><strong>Instructions:</strong></p>
      <div>
        Maximum file size - 5MB.<br>
        Supported file formats: <strong>PNG, JPG, JPEG</strong>
      </div>
    </div>

    <!-- Fixed button section -->
    <div class="button-section">
      <button mat-stroked-button class="flex justify-center items-center mat-btn-outline cancel-button app-btn"
        (click)="onCancel()">Cancel</button>
      <button mat-flat-button class="save-button" (click)="onUpload()" [disabled]="isLoading">Upload</button>
    </div>
  </div>
</div>
