<div class="flex flex-1 flex-column min-wid sidenav-wrap text-center">
  <div class="margin-top-xs flex flex-column max-width width-1-1">
    <a href="javascript:void(0)" role="link" class="flex flex-column padding-right-m padding-left-m">
      <div class="dept-logo-block flex flex-middle flex-center position-relative">
        <img [src]="orgData" [alt]="widgetData.name" class="img-logo" (error)="changeToDefaultImg($event)" />
        <!-- Pencil Icon -->
        <button mat-icon-button class="pencil-icon" (click)="onEditLogoClick()" aria-label="Edit Logo">
          <!-- <mat-icon class="custom-font">cloud_upload</mat-icon> -->
          <mat-icon class="custom-font">edit</mat-icon>
        </button>
        <input #fileInput type="file" accept=".png, .jpeg, .jpg" (change)="fileChangeEvent($event)"
          style="display: none;" />
      </div>
      <span class="mat-subheading-2 margin-top-m dept-name">
        {{ channelName | titlecase}}
      </span>
    </a>
  </div>
</div>
<ng-container *ngFor="let menu of menulist; let mi = index">
  <ng-container *ngIf="menu.subMenu && isAllowed(menu)">
    <mat-accordion [multi]="true" class="custom-leftmenu">
      <mat-expansion-panel class="menuPannel bg-gray-accordian" hideToggle="true" [expanded]="menu.defaultExpanded"
        #example>
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-panel-description>
              <p class="margin-remove">{{menu?.menuCategory}}</p>
              <mat-icon *ngIf="!example.expanded">arrow_drop_down</mat-icon>
              <mat-icon *ngIf="example.expanded">arrow_drop_up</mat-icon>
            </mat-panel-description>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-nav-list class="nav-list-menu flex-1">
          <ng-container *ngFor="let tab of menu?.subMenu; let i = index">
            <ng-container>
              <a *ngIf="isAllowed(tab)" mat-list-item disableRipple class="flex outline-1 menu-item-a"
                [attr.data-index]="i" [routerLink]="[tab.routerLink]" [queryParamsHandling]="preserve"
                routerLinkActive="ws-active-route-men">
                <span class="padding-left-xs">{{tab?.name}}</span>
              </a>
            </ng-container>
          </ng-container>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-accordion>
  </ng-container>

  <ng-container *ngIf="!menu.subMenu">
    <mat-nav-list class="nav-list-menu flex-1">
      <a mat-list-item *ngIf="isAllowed(menu)" disableRipple class="flex outline-1 main-menuitem" [attr.data-index]="mi"
        [routerLink]="[menu.routerLink]" [queryParamsHandling]="preserve" routerLinkActive="ws-active-route-men">
        <span class="padding-left-xs sub-menu-text">{{menu?.menuCategory}}</span>
      </a>
    </mat-nav-list>
  </ng-container>
</ng-container>
