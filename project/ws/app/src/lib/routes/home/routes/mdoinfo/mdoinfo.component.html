<div class="container-balanced width-100">
    <div class="flex flex-1 custom">
        <div class="flex-3">
            <div class="flex flex-1 margin-left-xl margin-top-l">
                <ws-widget-breadcrumbs-org
                [widgetData]="{titles:[{title:'Home', url:'/app/home'},{title: 'MDO information', url:'none'}] }">
                </ws-widget-breadcrumbs-org>
            </div>
            <div class="flex flex-4 flex-column">
                <div class="flex flex-1 custom">
                    <mat-sidenav-container class="container-balanced" autosize name="discuss-menu">
                        <mat-sidenav [mode]="mode$ | async" [(opened)]="sideNavBarOpened" class="border-0 ">
                            <div class="contain">
                            <!-- <ng-container [sbUiResolverWidget]="tabsData" *ngIf="widgetData"></ng-container> -->
                            <div class="flex-1" style="position: relative;">
                                <div #stickyMenu [class.sticky]="sticky">
                                <ws-app-left-menu [tabsData]="tabsData" class="flex flex-1"></ws-app-left-menu>
                                </div>
                            </div>
                            </div>
                        </mat-sidenav>
                        <mat-sidenav-content>
                            <div *ngIf="screenSizeIsLtMedium">
                            <button type="button" mat-icon-button (click)="sideNavBarOpened = !sideNavBarOpened"
                                id="ws-auth-root-home-btn-menu" name="ws-auth-root-home-btn-menu">
                                <mat-icon>menu</mat-icon>
                            </button>
                            </div>
                            <div class="width-100 margin-bottom-xl">
                                <router-outlet></router-outlet>
                            </div>
                        </mat-sidenav-content>
                    </mat-sidenav-container>
                </div>
            </div>
        </div>
        <div class="flex-1" style="border-left: 1px solid #0000000f;">
            <ng-container id="changelog">
                <div id="mdoinfo-change-log">
                <label for="mdoinfo-change-log" class="change-log-text margin-top-l margin-bottom-l margin-left-m margin-right-m">Change log</label>
                <div class="w-full profile-cols-full bg-grey" *ngIf="wfHistory && wfHistory.length > 0">
                    <div class="change-log-wrapper" *ngFor="let wfh of wfHistory; let i = index">
                    <div id="mdoinfo-change-log-entry-{{i}}" class="margin-top-l margin-bottom-l margin-left-m margin-right-m">
                        <label for="mdoinfo-change-log-entry-{{i}}" class=" field-key">{{wfh.fieldKey}}</label>
                        <label for="mdoinfo-change-log-entry-{{i}}" class="field-name">{{wfh.fieldName}}</label>
                        <label for="mdoinfo-change-log-entry-{{i}}" *ngIf="wfh.action === 'APPROVE'" class="field-change">Changed from {{'"'+ wfh.fromValue +'"'}}
                        to
                        {{'"'+ wfh.toValue +'"'}}</label>
                        <label for="mdoinfo-change-log-entry-{{i}}" *ngIf="wfh.action === 'REJECT'" class="field-change">{{wfh.fieldName}} was rejected with
                        {{wfh.comment}}</label>
                        <label for="mdoinfo-change-log-entry-{{i}}" class="field-date">{{wfh.requestedon}}</label>
                    </div>
                    </div>
                </div>
                <div id="mdoinfo-no-updates" class="appr-label" *ngIf="wfHistory && wfHistory.length <= 0">
                    <label for="mdoinfo-no-updates" class="no-request-text">No updates yet</label>
                </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
