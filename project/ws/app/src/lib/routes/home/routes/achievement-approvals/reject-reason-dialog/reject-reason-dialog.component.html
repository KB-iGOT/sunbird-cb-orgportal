<h2 mat-dialog-title>{{ data?.title || 'Reason for rejection' }}</h2>

<mat-dialog-content>
  <p *ngIf="data?.message" class="reject-reason-message">
    {{ data.message }}
  </p>

  <form [formGroup]="form" class="reject-reason-form">
    <mat-form-field appearance="outline" class="w-full">
      <textarea matInput formControlName="reason" placeholder="Type the reason in fewer than {{ maxLength }} characters" rows="5">
      </textarea>
      <mat-hint align="end">
        {{ form.get('reason')?.value?.length || 0 }}/{{ maxLength }}
      </mat-hint>
      <mat-error *ngIf="form.get('reason')?.hasError('required')">
        Reason is required
      </mat-error>
      <mat-error *ngIf="!form.get('reason')?.hasError('required') && form.get('reason')?.hasError('minlength') && !form.get('reason')?.hasError('maxlength')">
        Reason must be at least 100 characters
      </mat-error>
      <mat-error *ngIf="!form.get('reason')?.hasError('required') && !form.get('reason')?.hasError('minlength') && form.get('reason')?.hasError('maxlength')">
        Reason must be at most {{ maxLength }} characters
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="reject-reason-actions">
  <button mat-button type="button" (click)="onCancel()" class="cancle-btn">
    Cancel
  </button>
  <button mat-raised-button type="button" (click)="onConfirm()" [disabled]="form.invalid" class="confirm-btn">
    Confirm
  </button>
</mat-dialog-actions>
