<mat-card-title class="flex-4 mobile-margin mat-h2">
  Users
</mat-card-title>
<ng-container *ngIf="!createUser">
  <div class="flex">
    <div class="searchContainer flex gap-5">
      <div class="sinput flex flex-middle">
        <span class="material-icons"> search </span>
        <input class="w-full" type="Standard" label="" (input)="applyFilter(searchValue)" placeholder="Search"
          [(ngModel)]="searchValue" (keydown.enter)="onSearchEnter(searchValue)">
      </div>
      <button mat-button type="button" class="btn-common btn-primary">Search</button>
    </div>
    <div class="buttonContainer flex ml-auto">
      <button mat-button type="button" class="btn-common btn-primary" (click)="createNewUser()">Create
        User</button>
    </div>
  </div>
  <div class="table-container mt-5">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">

      <!-- Full Name Column -->
      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Name </th>
        <td mat-cell *matCellDef="let user"> {{ getFullName(user) }} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let user"> {{ emailTransform(user) || 'N/A' }} </td>
      </ng-container>

      <!-- Roles Column -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Roles </th>
        <td mat-cell *matCellDef="let user">
          <span *ngIf="user.roles && user.roles.length > 0" [innerHtml]="getRoleList(user.roles)"></span>
          <span *ngIf="!user.roles || user.roles.length === 0">No roles</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="editUser(user)">
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </button>
            <!-- <button mat-menu-item (click)="deleteUser(user)">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button> -->
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="custom-header"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">No data available</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</ng-container>

<ng-container *ngIf="createUser">
  <div class="flex">
    <ng-container *ngFor="let item of createUserTabs">
      <button mat-button type="button" (click)="onTabChange(item)"
        [ngClass]="{'activeTab': selectedTab?.value === item?.value}">{{item.name}}</button>
    </ng-container>
    <div class="ml-auto">
      <button mat-icon-button aria-label="Close create user tabs" (click)="createUser = false" type="button">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
  <div class="divider mb-5"></div>
  <ng-container *ngIf="selectedTab?.value === 'individualCreation'">
    <ws-single-user-creation [editUserData]="selectedUserData" [selectedOrgData]="orgData"
      (closeCreateuser)="closeCreate()"></ws-single-user-creation>
  </ng-container>
  <ng-container *ngIf="selectedTab?.value === 'customRegLink'">
    <ws-app-custom-self-registration></ws-app-custom-self-registration>
  </ng-container>
  <ng-container *ngIf="selectedTab?.value === 'bulkCreation'">
    <ws-bulk-upload [selectedOrgData]="orgData"></ws-bulk-upload>
  </ng-container>
</ng-container>
