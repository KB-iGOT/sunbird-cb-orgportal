<div class="mt-4">
  <div class="flex mat-h2 margin-remove gap-2 items-center justify-between pr-4">
    <div class="flex gap-2 items-center">
      <div class="link cursor-pointer" (click)="navigateToExternalTrainings()" (keydown.enter)="navigateToExternalTrainings()">External Trainings
      </div>
      <mat-icon>chevron_right</mat-icon>
      <div class="link cursor-pointer" (click)="navigateToBatches()" (keydown.enter)="navigateToBatches()">
        {{ training?.title }}
      </div>
      <mat-icon>chevron_right</mat-icon>
      <div>{{ currentBatch?.name }}</div>
    </div>
    <button mat-raised-button class="create-batch" (click)="createBatch()" *ngIf="currentTab === 'batches'">
      <mat-icon class="add">add</mat-icon>
      Create Batch
    </button>
  </div>

  <div class="batches-container">
    <ng-container *ngIf="!isLoading && currentBatch">
      <mat-card class="batch-card">
        <div class="batch-name">{{ currentBatch?.name }}</div>
        <div class="batch-dates">
          <div class="date-block">
            <span class="date-label">START DATE</span>
            <div class="date-value">
              <mat-icon class="date-icon">calendar_today</mat-icon>
              <span>{{ currentBatch?.startDate | date: 'dd/MM/yyyy' }}</span>
            </div>
          </div>
          <div class="date-block">
            <span class="date-label">END DATE</span>
            <div class="date-value">
              <mat-icon class="date-icon">calendar_today</mat-icon>
              <span>{{ currentBatch?.endDate | date: 'dd/MM/yyyy' }}</span>
            </div>
          </div>
        </div>
      </mat-card>
    </ng-container>
