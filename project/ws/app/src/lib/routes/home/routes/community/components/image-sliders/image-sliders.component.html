<ng-container *ngIf="imageUrls?.length">
  <div class="banner-container" (swipeleft)="slideTo(currentIndex + 1)" (swiperight)="slideTo(currentIndex - 1)"
    *ngIf="imageUrls?.length">
    <a class="banner-overlay {{imageUrls[currentIndex] && imageUrls[currentIndex].redirectUrl ? '' : 'pointer-events-none'}}"
      [routerLink]=" !isOpenInNewTab && imageUrls[currentIndex].redirectUrl? imageUrls[currentIndex].redirectUrl : null"
      [ngClass]="{'cursor-auto': !imageUrls[currentIndex].redirectUrl}">
      <div class="banner WidgetInstanceId" *ngFor="let slide of imageUrls; let i = index" [hidden]="i !== currentIndex">
        <img i18n-alt alt="Image{{i}}" [src]="slide" class=" banner-image" />
      </div>
    </a>
    <!-- <ng-container
      *ngIf="isMobile && styleData?.responsive?.dots !== 'hidden' || !isMobile && styleData?.dots !== 'hidden'">
      <div class="banner-meta {{isMobile? styleData?.responsive?.bannerMetaAlign : styleData?.bannerMetaAlign}}">
        <a [routerLink]=" !isOpenInNewTab && imageUrls[currentIndex].redirectUrl? imageUrls[currentIndex].redirectUrl : null"
          class="nodtranslate banner-title text-truncate {{imageUrls[currentIndex] && imageUrls[currentIndex].redirectUrl ? '' : 'pointer-events-none'}}"
          *ngIf="imageUrls[currentIndex].title" [title]="imageUrls[currentIndex].title">
          {{ imageUrls[currentIndex].title }}
        </a>
        <div class="dots-container" *ngIf="imageUrls?.length > 1">
          <span class="dot" [ngClass]="{ active: j === currentIndex }" *ngFor="let slide of imageUrls; let j = index"
            (click)="slideTo(j)"></span>
        </div>
      </div>
    </ng-container> -->
    <ng-container *ngIf="imageUrls?.length > 1">
      <div>
        <a *ngIf="imageUrls?.length > 1" role="button" class="prev" (keydown)="$event.preventDefault()"
          (click)="slideTo(currentIndex - 1)">&#10094;</a>
        <a *ngIf="imageUrls?.length > 1" role="button" class="next" (keydown)="$event.preventDefault()"
          (click)="slideTo(currentIndex + 1)">&#10095;</a>
      </div>
    </ng-container>
  </div>

</ng-container>
