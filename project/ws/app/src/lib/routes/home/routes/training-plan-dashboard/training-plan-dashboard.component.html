<div class="flex flex-4 flex-column">
  <mat-card>
    <div class="flex flex-between mat-h2 margin-remove">Training Plan
      <button mat-button type="button" class="create-cbp-btn" (click)="createCbp()">Create
        CBP</button>
    </div>
    <mat-card-content>
      <div class="flex flex-1 flex-column margin-fix">
        <div class="flex flex-1 filter max-height-60">
          <a routerLinkActive="router-link-active" class="filter-option"
            [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'live', 'ws-mat-accent-border font-medium':currentFilter !== 'live'}"
            mat-button (click)="tabNavigate('live', 'Designation'); tabTelemetry('live', 0)" role="button">Live</a>
          <a routerLinkActive="router-link-active" class="filter-option"
            [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'draft', 'ws-mat-accent-border font-medium':currentFilter !== 'draft'}"
            mat-button (click)="tabNavigate('draft', 'Designation'); tabTelemetry('draft', 1)" role="button">Drafts</a>
        </div>
      </div>
      <ng-container class="margin-top-l">
        <ws-widget-org-user-table-v2 [tableData]="tabledata" [data]="trainingPlanData" [isTrainingPlan]="true"
          [trainingTagList]="tagListData" [actionMenuItem]="pageConfig?.data?.actionMenu" [userId]="currentUser"
          (eOnButtonClick)="clickHandler($event)" (actionsClick)="menuSelected($event)"
          (tagSelectedData)="filterDataAsPerTab($event)" *ngIf="currentFilter === 'live' && fetchContentDone"
          (searchByEnterKey)="searchTrainingPlan($event)" [totalRecords]="totalTrainingPlanCount"
          (pageChangeClick)="onPaginateChange($event)" [tabChangeIndex]="pageIndex">
        </ws-widget-org-user-table-v2>
        <ws-widget-org-user-table-v2 [tableData]="tabledata" [data]="trainingPlanData" [isTrainingPlan]="true"
          [isUpload]=false [trainingTagList]="tagListData" [actionMenuItem]="pageConfig?.data?.actionMenu"
          [userId]="currentUser" (eOnButtonClick)="clickHandler($event)" (actionsClick)="menuSelected($event)"
          (tagSelectedData)="filterDataAsPerTab($event)" *ngIf="currentFilter === 'draft' && fetchContentDone"
          (searchByEnterKey)="searchTrainingPlan($event)" [totalRecords]="totalTrainingPlanCount"
          (pageChangeClick)="onPaginateChange($event)" [tabChangeIndex]="pageIndex">
        </ws-widget-org-user-table-v2>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
