<div class="flex flex-4 flex-column mt-4">
  <!-- #region (Directory) -->
  <mat-card class="flex-custom">
    <mat-card-header class="flex-custom-m mb-3">
      <div class="flex-1" role="link" tabindex="0">
        <div class="flex flex-1">
          <mat-card-title class="flex-4 mobile-margin">
            <span class="mat-title">Directory</span>
          </mat-card-title>
        </div>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-1 flex-column margin-fix">
        <mat-tab-group (selectedTabChange)="onTabChange($event)">
          <ng-container *ngFor="let item of tabs; let i = index">
            <mat-tab>
              <ng-template mat-tab-label>
                <span>{{ item.name }}</span>
              </ng-template>
              <ng-template matTabContent>
                <ng-container *ngIf="selectedTabIndex === i">
                  <ng-container *ngTemplateOutlet="item.temp"></ng-container>
                </ng-container>
              </ng-template>
            </mat-tab>
          </ng-container>
          <!-- <ng-container *ngIf="showOrganisationTab">
            <mat-tab>
              <ng-template mat-tab-label>
                <span>Organisation</span>
              </ng-template>
              <ng-template matTabContent>
                <ng-container *ngIf="selectedTabIndex === 0">
                  <ng-container *ngTemplateOutlet="organisationTabContent"></ng-container>
                </ng-container>
              </ng-template>
            </mat-tab>
          </ng-container>
          <ng-container>
            <mat-tab>
              <ng-template mat-tab-label>
                <span>Organisation Hierarchies</span>
              </ng-template>
              <ng-template matTabContent>
                <ng-container *ngIf="selectedTabIndex === 1">
                  <ng-container *ngTemplateOutlet="organisationHierarchiesTabContent"></ng-container>
                </ng-container>
              </ng-template>
            </mat-tab>
          </ng-container> -->
        </mat-tab-group>
      </div>
    </mat-card-content>
  </mat-card>
  <!-- #endregion (Directory) -->

  <!-- #region (Organisation Tab Content) -->
  <ng-template #organisationTabContent>
    <ws-app-directory-table></ws-app-directory-table>
  </ng-template>
  <!-- #endregion (Organisation Tab Content) -->

  <!-- #region (Organisation Hierarchies Tab Content) -->
  <ng-template #organisationHierarchiesTabContent>
    <ws-app-org-hierarchy-mapping></ws-app-org-hierarchy-mapping>
  </ng-template>
  <!-- #endregion (Organisation Hierarchies Tab Content) -->

</div>
