<div class="m-8">
  <ws-widget-breadcrumbs-org
    [widgetData]="{titles:[{title:'Organisation', url:'/app/home/directory', path: '/app/home/directory'},{title: getCurrentTabDetails()?.name || '', url:'none'}] }">
  </ws-widget-breadcrumbs-org>
  <div class="vertical-tabs-container">
    <mat-tab-group class="vertical-tabs" [selectedIndex]="selectedTabIndex" (selectedIndexChange)="onTabChange($event)">
      <mat-tab *ngFor="let tab of tabs; let i = index" [label]="tab.name">
        <ng-container *ngIf="tab.value === 'users'">
          <ws-app-create-user></ws-app-create-user>
        </ng-container>
        <ng-container *ngIf="tab.value === 'rolesAndAccess'">
          <p>Roles and access content</p>
        </ng-container>
        <ng-container *ngIf="tab.value === 'mentorManagement'">
          <p>Mentor Management content</p>
        </ng-container>
        <ng-container *ngIf="tab.value === 'designationMaster'">
          <ws-app-designations-master></ws-app-designations-master>
        </ng-container>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
