<div class="flex">
  <ng-container *ngFor="let item of createUserTabs">
    <button mat-button type="button" (click)="onTabChange(item)"
      [ngClass]="{'activeTab': selectedTab?.value === item?.value}">{{item.name}}</button>
  </ng-container>
  <!-- <div class="ml-auto">
    <button mat-icon-button aria-label="Close create user tabs" (click)="createUser = false" type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div> -->
</div>
<div class="divider mb-5"></div>
<ng-container *ngIf="selectedTab?.value === 'individualCreation'">
  <ws-single-user-creation [editUserData]="selectedUserData" [selectedOrgData]="orgData"
    (userCreated)="onUserCreated($event)"></ws-single-user-creation>
</ng-container>
<ng-container *ngIf="selectedTab?.value === 'customRegLink'">
  <ws-app-custom-self-registration></ws-app-custom-self-registration>
</ng-container>
<ng-container *ngIf="selectedTab?.value === 'bulkCreation'">
  <ws-bulk-upload [selectedOrgData]="orgData"></ws-bulk-upload>
</ng-container>
