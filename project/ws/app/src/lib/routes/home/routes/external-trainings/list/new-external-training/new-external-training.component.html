<div class="external-training-container">
  <div class="header">
    <button mat-icon-button class="back-button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="header-content">
      <h1 class="title">Upload External Training Details</h1>
      <p class="subtitle">Provide training information and bulk upload participant records.</p>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="trainingForm">
      <div class="section-header">
        <h2>Training / Workshop Details</h2>
      </div>

      <!-- Training Title -->
      <div class="form-field">
        <label for="trainingTitle" class="required">Training Title</label>
        <input id="trainingTitle" type="text" formControlName="trainingTitle" placeholder="Enter the full title of the training program"
          class="input-field" />
      </div>

      <!-- Learning Objective -->
      <div class="form-field">
        <label for="learningObjective">Learning Objective</label>
        <textarea id="learningObjective" formControlName="learningObjective" placeholder="Describe the key learning outcomes and goals" rows="4"
          class="input-field textarea-field"></textarea>
      </div>

      <!-- Delivery Mode, Learning Hours, Training Type Row -->
      <div class="form-row">
        <!-- Delivery Mode -->
        <div class="form-field form-field-third">
          <label for="deliveryMode">Delivery Mode</label>
          <select id="deliveryMode" formControlName="deliveryMode" class="input-field select-field">
            <option value="">Select Delivery Mode</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>

        <!-- Learning Hours -->
        <div class="form-field form-field-third">
          <label for="learningHours">Learning Hours</label>
          <input id="learningHours" type="number" formControlName="learningHours" placeholder="Total duration in hours" class="input-field" />
        </div>

        <!-- Training Type -->
        <div class="form-field form-field-third">
          <label for="trainingType" class="required">Training Type</label>
          <select id="trainingType" formControlName="trainingType" class="input-field select-field">
            <option value="">Select Training Type</option>
            <option value="workshop">Workshop</option>
            <option value="seminar">Seminar</option>
            <option value="certification">Certification</option>
            <option value="course">Course</option>
          </select>
        </div>
      </div>

      <!-- Partner Name and Partner Logo Row -->
      <div class="form-row">
        <!-- Partner Name -->
        <div class="form-field form-field-half">
          <label for="partnerName">Partner Name</label>
          <input id="partnerName" type="text" formControlName="partnerName" placeholder="Enter training partner or organization name"
            class="input-field" />
        </div>

        <!-- Partner Logo -->
        <div class="form-field form-field-half">
          <label for="partnerLogo">Partner Logo</label>
          <div class="file-upload-container">
            <input type="text" [value]="selectedFileName || 'No file selected'" readonly class="input-field file-display" />
            <button type="button" mat-raised-button color="primary" class="upload-button" (click)="fileInput.click()">
              <mat-icon>upload</mat-icon>
              Upload Logo
            </button>
            <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none;" />
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
