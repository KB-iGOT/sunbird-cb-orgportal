  </form>

  <div class="w-full flex">
    <div class="form-options">
      <ng-container *ngFor="let section of sections">
        <div
          class="form-option mb-5 flex items-center p-4 gap-3 cursor-pointer {{selectedTab === section.type ? 'active' : ''}}"
          (click)="addContent(section.type)">
          <div class="icons"><mat-icon class="">{{section.icon}}</mat-icon></div>
          <div class="{{selectedTab === section.type ? 'text-white' : ''}}">
            <div class="icon-title">{{section.title}}</div>
            <div class="icon-sub-title pt-1">{{section.subTitle}}</div>
          </div>
        </div>
      </ng-container>
    </div>
    <div class="form-questions" *ngIf="getQuestions?.controls?.length">
      <div *ngFor="let row of getQuestions?.controls; let i = index">
        <ng-container>
          <ws-app-custom-input-text [question]="row" [customForm]="customForm" [index]="i"></ws-app-custom-input-text>
        </ng-container>
      </div>
      <div class="flex justify-between mt-5 gap-4"
        *ngIf="selectedTab === 'masterList' || selectedTab === 'multiMasterList'">
        <div class="flex flex-col items-center">
          <div class="text-primary cursor-pointer ws-mat-white-background round mat-raised-button mat-button-base"
            (click)="fileInput.click()" (dblclick)="$event.preventDefault()">
            Upload file</div>
          <input hidden type="file" #fileInput (click)="handleFileClick($event)" (change)="handleOnFileChange($event)"
            name="file" placeholder="Choose file" (dblclick)="$event.preventDefault();"
            accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" />
        </div>
        <button mat-button class="ws-mat-white-background round mat-raised-button mat-button-base"
          (click)="addQuestion('inputText')" *ngIf="selectedTab === 'multiMasterList'">Add new question</button>

      </div>
      <div class="flex justify-end mt-5 gap-4">
        <ng-container>
          <button mat-button class="text-white ws-mat-primary-background round mat-raised-button mat-button-base"
            [disabled]="customForm.invalid" (click)="onSave()">
            Save
          </button>
        </ng-container>
        <button mat-button class="ws-mat-white-background round mat-raised-button mat-button-base"
          (click)="onCancel()">Cancel</button>
      </div>
    </div>
  </div>
