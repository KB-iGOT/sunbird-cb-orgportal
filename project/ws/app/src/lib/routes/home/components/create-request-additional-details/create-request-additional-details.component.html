<div class="w-full">
  <form [formGroup]="additionalDetailsForm" class="w-full flex flex-column gap-6">
    <div class="flex flex-col gap-1 round-control">
      <span class="round-control-label required">Course Language</span>
      <mat-form-field appearance="outline" class="w-full">
        <mat-select formControlName="courseLanguage">
          <mat-option *ngFor="let language of languagesList" [value]="language.value">
            {{ language.displayName }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex flex-col gap-1 round-control user-type-checkboxes">
      <span class="round-control-label required">Sectoral Subject Matter Expert Available with MDO</span>
      <mat-radio-group formControlName="availableWithMDO" class="flex gap-3 flex-wrap">
        <mat-radio-button class="rounded-outline-radio" [value]="true">
          Yes
        </mat-radio-button>
        <mat-radio-button class="rounded-outline-radio" [value]="false">
          No
        </mat-radio-button>
      </mat-radio-group>
      <mat-error *ngIf="controlValidationStatus('availableWithMDO', 'required')">
        Sectoral Subject Matter Expert selection is required
      </mat-error>
    </div>

    <div class="flex flex-col gap-1 round-control user-type-checkboxes">
      <span class="round-control-label required">Course Digitisation Agency Required From Karmayogi Bharat</span>
      <mat-radio-group formControlName="requiredFromKB" class="flex gap-3 flex-wrap">
        <mat-radio-button class="rounded-outline-radio" [value]="true">
          Yes
        </mat-radio-button>
        <mat-radio-button class="rounded-outline-radio" [value]="false">
          No
        </mat-radio-button>
      </mat-radio-group>
      <mat-error *ngIf="controlValidationStatus('requiredFromKB', 'required')">
        Course Digitisation Agency selection is required
      </mat-error>
    </div>

    <div class="flex flex-col gap-1 round-control">
      <span class="round-control-label required">Reference Link</span>
      <mat-form-field appearance="outline" class="w-full add-subscript-wrapper">
        <input matInput formControlName="referenceLink" placeholder="Provide reference link" />

        <!-- <mat-error *ngIf="controlValidationStatus('referenceLink', 'pattern')">
          Reference Link can only contain ( a-z/A-Z , 0-9 . - _ $ / : [ ]' ' !) characters
        </mat-error> -->
      </mat-form-field>
    </div>
  </form>
</div>
