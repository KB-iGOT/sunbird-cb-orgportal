<div class="flex flex-1 flex-column form-container">
    <div class="label">
        Add timeline
    </div>
    <div class="form-element mb-3 timeline-row">
        <div class="timeline-field">
            <div class="fonm-element-label">Timeline <span class="required"></span></div>
            <div class="calender">
                <mat-form-field appearance="outline" class="w-half">
                    <mat-label class="timeline-date">Select date</mat-label>
                    <input matInput #ref [matDatepicker]="picker" [min]="minDate" [(ngModel)]="todayDate"
                        (dateChange)="changeTimeline(ref.value)" readonly>
                    <mat-datepicker-toggle matSuffix [for]="picker">
                        <mat-icon matDatepickerToggleIcon *ngIf="todayDate">event</mat-icon>
                        <mat-icon matDatepickerToggleIcon *ngIf="!todayDate">date_range</mat-icon>
                    </mat-datepicker-toggle>
                    <mat-datepicker #picker disabled="false"></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <!-- The plan is being authored, so the year can be changed here, never to a year the config
             has closed. A plan being previewed shows its year read only instead -->
        <ws-app-apar-year-select class="apar-year-field" width="100%" [value]="aparYear" [editableOnly]="true"
            (valueChange)="changeAparYear($event)"></ws-app-apar-year-select>
    </div>
</div>
