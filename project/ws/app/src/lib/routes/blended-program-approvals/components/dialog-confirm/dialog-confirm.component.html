<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  {{ data.body }}
</div>
<div mat-dialog-actions class="flex-row-reverse">
  <button mat-button [mat-dialog-close] i18n>{{data?.no? data?.no :'No'}}</button>
  <button mat-button class="margin-right-xs yes-btn" (click)="confirmed()" i18n>
    {{data?.yes? data?.yes :'Yes'}}
  </button>
</div>
