<div class="container-balanced">
  <div class="flex flex-1 custom">
    <div class="flex-3">
      <ws-widget-breadcrumbs-org
        [widgetData]="{titles:[{title:'Users', url:'/app/home/users'},{title:'Active', url:'none'},{title:fullname,url:'none'}] }">
      </ws-widget-breadcrumbs-org>
      <div class="flex flex-4 flex-column">
        <div class="flex flex-1 custom">
          <div class="flex-1" style="position: relative;">
            <div #stickyMenu [class.sticky]="sticky">
              <ws-widget-scrollspy-left-menu [currentTab]="currentTab" [tabsData]="tabsData" class="flex flex-1"
                (eSideNavClick)="onSideNavTabClick($event)">
              </ws-widget-scrollspy-left-menu>
            </div>
          </div>
          <div class="flex-3">
            <div class="flex flex-1 flex-column">
              <!-- Basic Info card -->
              <mat-card id="personalInfo"
                class="flex flex-1 flex-column margin-left-m margin-bottom-m margin-right-m ws-mat-accent-border">
                <div class="flex-custom">
                  <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
                    <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading" role="link" tabindex="0">
                      Personal details
                    </span>

                    <div class="margin-top-xl new-mobile" *ngIf="basicInfo">
                      <div class="flex flex-wrap mobile-break">
                        <div class="w-full profile-cols-full bg-grey">
                          <ng-container>
                            <mat-grid-list cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <img [src]="basicInfo.photo" alt="User Avatar" (error)="changeToDefaultImg($event)">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-full-name" class="appr-text-label">Full name</label>
                                <input id="view-event-full-name" type="text" [disabled]="true" [value]="basicInfo.firstname"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <!-- <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                              <label class="appr-text-label">Middle Name</label>
                              <input type="text" [disabled]="true" [value]="basicInfo.middlename" class="appr-text-field">
                            </mat-grid-tile> -->

                              <!-- <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label class="appr-text-label">Last name</label>
                                <input type="text" [disabled]="true" [value]="basicInfo.surname"
                                  class="appr-text-field">
                              </mat-grid-tile> -->

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-dob" class="appr-text-label">Date of birth (dd-mm-yy)</label>
                                <input id="view-event-dob" type="text" [disabled]="true" [value]="basicInfo.dob" class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-nationality" class="appr-text-label">Nationality</label>
                                <input id="view-event-nationality" type="text" [disabled]="true" [value]="basicInfo.nationality"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-gender" class="appr-text-label">Gender</label>
                                <mat-radio-group id="view-event-gender" [value]="basicInfo.gender" [disabled]="true"
                                  aria-label="Select an option">
                                  <mat-radio-button value="Male" class="radio-btn">Male</mat-radio-button>
                                  <mat-radio-button value="Female" class="radio-btn">Female</mat-radio-button>
                                  <mat-radio-button value="Others" class="radio-btn">Others</mat-radio-button>
                                </mat-radio-group>
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-marital-status" class="appr-text-label">Marital status</label>
                                <mat-radio-group id="view-event-marital-status" [value]="basicInfo.maritalStatus" [disabled]="true"
                                  aria-label="Select an option">
                                  <mat-radio-button value="Single" class="radio-btn">Single</mat-radio-button>
                                  <mat-radio-button value="Married" class="radio-btn">Married</mat-radio-button>
                                </mat-radio-group>
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-category" class="appr-text-label">Category</label>
                                <mat-radio-group id="view-event-category" [value]="basicInfo.category" [disabled]="true"
                                  aria-label="Select an option">
                                  <mat-radio-button value="General" class="radio-btn">General</mat-radio-button>
                                  <mat-radio-button value="OBC" class="radio-btn">OBC</mat-radio-button>
                                  <mat-radio-button value="SC" class="radio-btn">SC</mat-radio-button>
                                  <mat-radio-button value="ST" class="radio-btn">ST</mat-radio-button>
                                  <mat-radio-button value="PWD" class="radio-btn">PWD</mat-radio-button>
                                </mat-radio-group>
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-mother-tongue" class="appr-text-label">Mother tongue</label>
                                <input id="view-event-mother-tongue" type="text" [disabled]="true" [value]="basicInfo.domicileMedium"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-known-languages" class="appr-text-label">Other Known Languages</label>
                                <input id="view-event-known-languages" type="text" [disabled]="true" [value]="basicInfo.knownLanguages"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-mobile" class="appr-text-label">Mobile number</label>
                                <input id="view-event-mobile" type="text" [disabled]="true" [value]="basicInfo.mobile" class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-telephone" class="appr-text-label">Telephone number</label>
                                <input id="view-event-telephone" type="text" [disabled]="true" [value]="basicInfo.telephone"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-primary-email" class="appr-text-label">Primary email</label>
                                <input id="view-event-primary-email" type="text" [disabled]="true" [value]="basicInfo.primaryEmail"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-secondary-email" class="appr-text-label">Secondary email</label>
                                <input id="view-event-secondary-email" type="text" [disabled]="true" [value]="basicInfo.personalEmail"
                                  class="appr-text-field">
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-postal-address" class="appr-text-label">Postal address</label>
                                <textarea id="view-event-postal-address" [disabled]="true" rows="3" [value]="basicInfo.postalAddress"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pincode" class="appr-text-label">Pin Code</label>
                                <input id="view-event-pincode" type="text" [disabled]="true" [value]="basicInfo.pincode"
                                  class="appr-text-field">
                              </mat-grid-tile>

                            </mat-grid-list>
                          </ng-container>
                        </div>
                      </div>
                    </div>
                  </mat-card-content>
                </div>
              </mat-card>

              <!-- Academic card -->
              <mat-card id="academics"
                class="flex flex-1 flex-column margin-top-m margin-bottom-m margin-left-m margin-right-m ws-mat-accent-border">
                <div class="flex-custom">
                  <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
                    <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading" role="link" tabindex="0">
                      Academics
                    </span>
                    <div class="margin-top-xl new-mobile" *ngIf="academicDetails">
                      <div class="flex flex-wrap mobile-break">
                        <div class="w-full profile-cols-full bg-grey" *ngFor="let academic of academicDetails; let i = index">

                          <ng-container *ngIf="academic.type == 'X_STANDARD'">
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-x-std-details-{{i}}" class="header-text">10th standard</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-x-std-details-{{i}}" cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-x-std-school-{{i}}" class="appr-text-label">School name</label>
                                <input id="view-event-x-std-school-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfInstitute">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-x-std-year-{{i}}" class="appr-text-label">Year of passing</label>
                                <input id="view-event-x-std-year-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.yearOfPassing">
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>

                          <ng-container *ngIf="academic.type == 'XII_STANDARD'">
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-xii-std-details-{{i}}" class="header-text">12th standard</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-xii-std-details-{{i}}" cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-xii-std-school-{{i}}" class="appr-text-label">School name</label>
                                <input id="view-event-xii-std-school-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfInstitute">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-xii-std-year-{{i}}" class="appr-text-label">Year of passing</label>
                                <input id="view-event-xii-std-year-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.yearOfPassing">
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>

                          <ng-container *ngIf="academic.type == 'GRADUATE'">
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-grad-details-{{i}}" class="header-text">Graduation details</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-grad-details-{{i}}" cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-grad-degree-{{i}}" class="appr-text-label">Degree</label>
                                <input id="view-event-grad-degree-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfQualification">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-grad-institute-{{i}}" class="appr-text-label">Institute name</label>
                                <input id="view-event-grad-institute-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfInstitute">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-grad-year-{{i}}" class="appr-text-label">Year of passing</label>
                                <input id="view-event-grad-year-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.yearOfPassing">
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>

                          <ng-container *ngIf="academic.type == 'POST_GRADUATE'">
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pg-details-{{i}}" class="header-text">Post graduation details</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-pg-details-{{i}}" cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pg-degree-{{i}}" class="appr-text-label">Degree</label>
                                <input id="view-event-pg-degree-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfQualification">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pg-institute-{{i}}" class="appr-text-label">Institute name</label>
                                <input id="view-event-pg-institute-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.nameOfInstitute">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pg-year-{{i}}" class="appr-text-label">Year of passing</label>
                                <input id="view-event-pg-year-{{i}}" type="text" class="appr-text-field" [disabled]="true"
                                  [value]="academic.yearOfPassing">
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>

                        </div>
                      </div>
                    </div>
                  </mat-card-content>
                </div>
              </mat-card>

              <!-- Professional details card -->
              <mat-card id="profdetails"
                class="flex flex-1 flex-column margin-top-m margin-bottom-m margin-left-m margin-right-m ws-mat-accent-border">
                <div class="flex-custom">
                  <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
                    <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading" role="link" tabindex="0">
                      Professional details
                    </span>
                    <div class="margin-top-xl new-mobile" *ngIf="professionalDetails">
                      <div class="flex flex-wrap mobile-break">
                        <div class="w-full profile-cols-full bg-grey">
                          <ng-container>
                            <mat-grid-list cols="1" rowHeight="100px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-org-type" class="appr-text-label">Type of organisation</label>
                                <mat-radio-group id="view-event-org-type" [value]="professionalDetails.organisationType" [disabled]="true"
                                  aria-label="Select an option">
                                  <mat-radio-button value="Government" class="radio-btn">Government organisation
                                  </mat-radio-button>
                                  <mat-radio-button value="Non-Government" class="radio-btn">Non-government
                                    organisation
                                  </mat-radio-button>
                                </mat-radio-group>
                              </mat-grid-tile>

                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-mdo" class="appr-text-label">MDO</label>
                                <input id="view-event-mdo" type="text" [disabled]="true" class="appr-text-field"
                                  [value]="employmentDetails.departmentName">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-industry" class="appr-text-label">Industry</label>
                                <input id="view-event-industry" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-designation" class="appr-text-label">Designation</label>
                                <input id="view-event-designation" type="text" [disabled]="true" [value]="professionalDetails.designation"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-location" class="appr-text-label">Location</label>
                                <input id="view-event-location" type="text" [disabled]="true" [value]="professionalDetails.location"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-description" class="appr-text-label">Description</label>
                                <textarea id="view-event-description" [disabled]="true" rows="2" [value]="professionalDetails.description"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                            </mat-grid-list>

                            <mat-grid-list cols="1" rowHeight="50px" class="margin-top-xl">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-govt-details" class="middle-heading">Other details for government employess (If
                                  applicable)</label>
                              </mat-grid-tile>
                            </mat-grid-list>

                            <mat-grid-list id="view-event-govt-details" cols="2" rowHeight="100px">
                              <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-pay-band" class="appr-text-label">Pay band (grade pay)</label>
                                <input id="view-event-pay-band" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-service" class="appr-text-label">Service</label>
                                <input id="view-event-service" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-cadre" class="appr-text-label">Cadre</label>
                                <input id="view-event-cadre" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-allotment-year" class="appr-text-label">Allotment year of service</label>
                                <input id="view-event-allotment-year" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-doj" class="appr-text-label">Date of joining</label>
                                <input id="view-event-doj" type="text" [disabled]="true" [value]="professionalDetails.doj"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-civil-list-number" class="appr-text-label">Civil list number</label>
                                <input id="view-event-civil-list-number" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-employee-code" class="appr-text-label">Emplyee code</label>
                                <input id="view-event-employee-code" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-official-location" class="appr-text-label">Location</label>
                                <input id="view-event-official-location" type="text" [disabled]="true" [value]="professionalDetails.location"
                                  class="appr-text-field">
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-official-postal-address" class="appr-text-label">Official Postal address</label>
                                <textarea id="view-event-official-postal-address" [disabled]="true" rows="3" [value]="professionalDetails.completePostalAddress"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-official-pincode" class="appr-text-label">Pin Code</label>
                                <input id="view-event-official-pincode" type="text" [disabled]="true" [value]="professionalDetails.industry"
                                  class="appr-text-field">
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>
                        </div>
                      </div>
                    </div>
                  </mat-card-content>
                </div>
              </mat-card>

              <!-- Skills card -->
              <mat-card id="skills"
                class="flex flex-1 flex-column margin-top-m margin-bottom-m margin-left-m margin-right-m ws-mat-accent-border">
                <div class="flex-custom">
                  <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
                    <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading" role="link" tabindex="0">
                      Certification and skills
                    </span>
                    <div class="margin-top-xl new-mobile" *ngIf="skillDetails">
                      <div class="flex flex-wrap mobile-break">
                        <div class="w-full profile-cols-full bg-grey">
                          <ng-container>
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-certification-details" class="appr-text-label">Certification</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-certification-details" cols="1" rowHeight="150px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-additional-skills" class="appr-text-label">Additional skill acquired/course completed</label>
                                <textarea id="view-event-additional-skills" [disabled]="true" rows="4" [value]="skillDetails.additionalSkills"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-certificate-details" class="appr-text-label">Provide certification details</label>
                                <textarea id="view-event-certificate-details" [disabled]="true" rows="4" [value]="skillDetails.certificateDetails"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list cols="1" rowHeight="50px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-skills-details" class="appr-text-label">Skills</label>
                              </mat-grid-tile>
                            </mat-grid-list>
                            <mat-grid-list id="view-event-skills-details" cols="1" rowHeight="150px">
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-professional-interests" class="appr-text-label">Professional interests</label>
                                <textarea id="view-event-professional-interests" [disabled]="true" rows="4" [value]="skillDetails.additionalSkills"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                              <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                                <label for="view-event-hobbies" class="appr-text-label">Hobbies</label>
                                <textarea id="view-event-hobbies" [disabled]="true" rows="4" [value]="skillDetails.certificateDetails"
                                  class="appr-text-field"></textarea>
                              </mat-grid-tile>
                            </mat-grid-list>
                          </ng-container>
                        </div>
                      </div>
                    </div>
                  </mat-card-content>
                </div>
              </mat-card>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-1" style="border-left: 1px solid #0000000f;">
      <ng-container id="changelog">
        <div>
          <label for="view-event-change-log-list" class="change-log-text margin-top-l margin-bottom-l margin-left-m margin-right-m">Change log</label>
          <div id="view-event-change-log-list" class="w-full profile-cols-full bg-grey" *ngIf="wfHistory && wfHistory.length > 0">
            <div class="change-log-wrapper" *ngFor="let wfh of wfHistory; let i = index">
              <div id="view-event-change-log-entry-{{i}}" class="margin-top-l margin-bottom-l margin-left-m margin-right-m">
                <label for="view-event-change-log-entry-{{i}}" class=" field-key">{{wfh.fieldKey}}</label>
                <label for="view-event-change-log-entry-{{i}}" class="field-name">{{wfh.fieldName}}</label>
                <label for="view-event-change-log-entry-{{i}}" *ngIf="wfh.action === 'APPROVE'" class="field-change">Changed from {{'"'+ wfh.fromValue +'"'}} to
                  {{'"'+ wfh.toValue +'"'}}</label>
                <label for="view-event-change-log-entry-{{i}}" *ngIf="wfh.action === 'REJECT'" class="field-change">{{wfh.fieldName}} was rejected with
                  {{wfh.comment}}</label>
                <label for="view-event-change-log-entry-{{i}}" class="field-date">{{wfh.requestedon}}</label>
              </div>
            </div>
          </div>
          <div id="view-event-no-updates" class="appr-label" *ngIf="wfHistory && wfHistory.length <= 0">
            <label for="view-event-no-updates" class="no-request-text">No updates yet</label>
          </div>
        </div>
      </ng-container>
    </div>
